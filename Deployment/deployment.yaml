apiVersion: apps/v1
kind: Deployment
metadata:
  name: servicetickettracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: servicetickettracker
  template:
    metadata:
      labels:
        app: servicetickettracker
    spec:
      containers:
        - name: servicetickettracker
          image: service_ticket_tracking:latest
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: servicetickettracker-service
spec:
  type: NodePort
  selector:
    app: servicetickettracker
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080
